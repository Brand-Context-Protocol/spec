name: Schema contract

on:
  pull_request:
    paths:
      - 'schema/**'
      - 'examples/**'
      - 'tests/**'
      - 'scripts/test-visual-schema.sh'
      - '.github/workflows/schema-contract.yml'
  push:
    branches: [main]
    paths:
      - 'schema/**'
      - 'examples/**'
      - 'tests/**'
      - 'scripts/test-visual-schema.sh'
      - '.github/workflows/schema-contract.yml'

permissions:
  contents: read

jobs:
  visual-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: bash scripts/test-visual-schema.sh
