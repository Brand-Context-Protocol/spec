name: Schema contract

on:
  pull_request:
    paths:
      - 'schema/**'
      - 'examples/**'
      - 'tests/**'
      - 'scripts/test-visual-schema.sh'
      - 'scripts/test-revision-extension.sh'
      - 'scripts/test-revision-vectors.mjs'
      - 'scripts/test-affordance-contract.*'
      - 'SPEC.md'
      - 'spec/**'
      - 'validator/**'
      - 'package*.json'
      - 'tests/bcp-2.test.cjs'
      - '.github/workflows/schema-contract.yml'
  push:
    branches: [main]
    paths:
      - 'schema/**'
      - 'examples/**'
      - 'tests/**'
      - 'scripts/test-visual-schema.sh'
      - 'scripts/test-revision-extension.sh'
      - 'scripts/test-revision-vectors.mjs'
      - 'scripts/test-affordance-contract.*'
      - 'SPEC.md'
      - 'spec/**'
      - 'validator/**'
      - 'package*.json'
      - 'tests/bcp-2.test.cjs'
      - '.github/workflows/schema-contract.yml'

permissions:
  contents: read

jobs:
  affordance-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: bash scripts/test-affordance-contract.sh

  visual-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: bash scripts/test-visual-schema.sh

  revision-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: bash scripts/test-revision-extension.sh

  bcp-2-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run validate -- package examples/2.0/package.json
